name: Release artifact check

on:
  pull_request:
    paths:
      - "scripts/**"
      - "src/test/sh/**"
      - "build.sbt"
      - "project/**"
      - ".github/workflows/release*.yml"

permissions:
  contents: read

concurrency:
  group: artifact-check-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  artifact:
    name: Build and verify release artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
          cache: sbt
      - name: Set up sbt
        uses: sbt/setup-sbt@67d461eba2c4753196c230e02da850757ba4775e # v1.5.14
      - name: Build and verify release artifact
        run: bash src/test/sh/release-artifact-test.sh
