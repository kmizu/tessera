name: Release artifact check

on:
  pull_request:
    paths:
      - "scripts/**"
      - "src/test/sh/**"
      - "build.sbt"
      - "project/**"
      - ".github/workflows/release*.yml"

permissions:
  contents: read

concurrency:
  group: artifact-check-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  artifact:
    name: Build and verify release artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
          cache: sbt
      - name: Set up sbt
        uses: sbt/setup-sbt@8feba82adc7f01ddcf8165b86f778bdb5b82cebc # v1.5.7
      - name: Build and verify release artifact
        run: bash src/test/sh/release-artifact-test.sh
