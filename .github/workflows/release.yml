name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Deployment gate: publishing waits for approval by the reviewers
    # configured on the `release` environment.
    environment: release
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up sbt
        uses: sbt/setup-sbt@82da71df4e122282484a99a8d70096bc2369dbd8 # v1.5.9
      - name: Verify tag and project version
        run: |
          version="$(bash scripts/project-version.sh)"
          bash scripts/verify-release-tag.sh "$GITHUB_REF_NAME" "$version"
      - name: Test release tag validator
        run: bash src/test/sh/release-tag-test.sh
      - name: Test release provenance validators
        run: bash src/test/sh/release-provenance-test.sh
      - name: Verify annotated tag and green main provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin main
          tagged_commit="$(bash scripts/verify-release-provenance.sh \
            "$GITHUB_REF_NAME" refs/remotes/origin/main)"
          bash scripts/verify-ci-provenance.sh \
            "$tagged_commit" "$GITHUB_SHA" "$GITHUB_REPOSITORY"
      - name: Stage release assets
        run: bash scripts/build-release.sh "$RUNNER_TEMP/tessera-release"
      - name: Verify staged release assets
        run: bash src/test/sh/release-artifact-test.sh "$RUNNER_TEMP/tessera-release"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          asset_dir="$RUNNER_TEMP/tessera-release"
          notes_file="docs/releases/$GITHUB_REF_NAME.md"
          if [[ ! -f "$notes_file" ]]; then
            echo "release notes not found: $notes_file" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            "$asset_dir/tessera-$version.jar" \
            "$asset_dir/tessera-$version.jar.sha256" \
            --verify-tag \
            --title "Tessera $GITHUB_REF_NAME" \
            --notes-file "$notes_file"
